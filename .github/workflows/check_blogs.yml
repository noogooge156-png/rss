name: Check Naver Blog RSS

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 정각 실행
  workflow_dispatch:        # 수동 실행 버튼도 활성화

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # seen_posts.json 커밋을 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run RSS checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_blogs.py

      - name: Commit updated seen_posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --cached --quiet || git commit -m "Update seen posts [skip ci]"
          git push
